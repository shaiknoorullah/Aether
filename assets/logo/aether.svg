<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Aether</title>
  <desc>The alchemical fire triangle (🜂) whose base is the statusbar. Gruvbox palette. Same license as the project (AGPL-3.0-or-later) unless relicensed separately — see assets/logo/README.md.</desc>
  <defs>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fabd2f"/>
      <stop offset="1" stop-color="#d79921"/>
    </linearGradient>
  </defs>
  <!-- tile: gruvbox bg0_h with a bg1 edge so it holds on dark launchers too -->
  <rect x="10" y="10" width="236" height="236" rx="52" fill="#1d2021" stroke="#3c3836" stroke-width="4"/>
  <!-- the base is the statusbar -->
  <path d="M52 192 H204" fill="none" stroke="#458588" stroke-width="26" stroke-linecap="round"/>
  <!-- the fire triangle, drawn as Λ over the base -->
  <path d="M52 192 L128 60 L204 192" fill="none" stroke="url(#flame)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
