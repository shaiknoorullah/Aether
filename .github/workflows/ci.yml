name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: tests, budget, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false # zero npm deps; nothing to cache

      - name: unit tests
        run: node --test overlay/test/unit/

      - name: budget (glue ceiling + runtime-path size)
        run: scripts/check-budget.sh

      - name: shellcheck
        run: |
          shellcheck --version
          # maintained scripts only — scripts/run_fleet.sh is retired research
          # tooling (CLAUDE.md: historical) and is not linted
          shellcheck overlay/install.sh overlay/bin/aether \
            scripts/check-budget.sh scripts/render-icons.sh

      - name: desktop entry
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          desktop-file-validate overlay/share/aether.desktop

      - name: version file
        run: grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' overlay/VERSION
