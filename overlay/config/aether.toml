# Aether config — lives at ~/.config/aether/aether.toml, git this with your dotfiles.
# Parsed by a deliberately small TOML subset parser: [sections], key = value,
# strings, integers, booleans, arrays of strings. Comments with #.

[options]
scroll_step = 120        # px per j/k
hint_chars = "asdfghjkl" # home row labels
statusbar_clock = true   # legacy: false drops the clock widget from the bar
pending_timeout_ms = 800 # multi-key sequence window
palette_max_items = 8    # completions rendered at once
config_watch = true      # saving this file is the reload; false = :config_reload only
which_key_ms = 400       # pause before the binding panel appears; 0 = instant, -1 = never

# Statusbar slots, rendered left to right in this order. Builtins: mode,
# workspace, focus, url, msg, tabs, ai, clock, date. Unknown ids are skipped
# silently. Refresh cadence is per-builtin.
[statusbar]
widgets = ["mode", "workspace", "focus", "url", "msg", "ai", "clock", "date"]

# Local AI sidebar: toggle with a / :ai, chat streams from the one
# OpenAI-compatible gateway everything converged on (Ollama/LM Studio/
# llama-server all speak /v1/chat/completions). enabled is the kill switch —
# OFF until you enable it; :ai_on/:ai_off persist over this value. base_url
# may only point at a loopback host (127.0.0.1, localhost, [::1]) — anything
# else makes AI unavailable, never a remote fetch.
[ai]
enabled = false
base_url = "http://127.0.0.1:11434/v1"
model = "llama3.2"

# Focus sessions: start with :focus <task>, end with :done or a workspace
# switch. Never a timer — the statusbar shows the task plus calm elapsed time.
[focus]
quiet_notifications = true # suppress web notifications during a session; restored on end

# Tab graveyard: every real close is archived — searchable with :graveyard,
# Enter resurrects. The ring cap is the only cleanup policy; the archive lives
# in <profile>/aether-graveyard.json.
[graveyard]
cap = 500 # ring size; oldest entries fall off past this

# Workspaces: named, container-isolated, persistent. Switch-or-create with
# :ws <name>, cycle with gw / :ws_next, rename with :ws_rename <name>. State
# lives in <profile>/aether-workspaces.json. resurrect: reopened tabs land at
# their remembered scroll position (silently; records age out after 30 days);
# off = never capture, never restore — existing records are left alone.
[workspaces]
default = "main" # the workspace a fresh profile starts in (no container)
resurrect = true

# Site boosts: per-domain CSS dotfiles, applied to matching sites on load.
# <domain>.css matches the exact host first, then parent domains down to two
# labels (no PSL — a co.uk-class false parent is handled by an exact-host
# file). :zap hint-picks an element to hide (appends to the dotfile),
# :boost_on / :boost_off toggle for the session, :boost_edit opens the file.
# CSS is sanitized on apply: the known CSS fetch vectors — @import, non-data:
# url(), non-data: image-set() sources — are stripped after CSS-escape
# decoding, so a synced dotfile gets no known network-fetch channel.
[boosts]
enabled = true
dir = "~/.config/aether/boosts"

# Theming: pywal/base16 ingestion. wal colors.json (if readable and valid)
# wins under "auto", then [theme.colors], then the builtin gruvbox. A broken
# palette file never bricks the chrome — it just falls back. Reload with
# :theme_reload (no file watching).
[theme]
source = "auto"                       # auto | wal | toml | builtin
wal_json = "~/.cache/wal/colors.json" # ~ expands to $HOME

# Base16-style fallback palette — strict #rrggbb, all-or-nothing.
# accent is optional and defaults to color4.
[theme.colors]
bg = "#1d2021"
fg = "#ebdbb2"
accent = "#458588"
color0 = "#282828"
color1 = "#cc241d"
color2 = "#98971a"
color3 = "#d79921"
color4 = "#458588"
color5 = "#b16286"
color6 = "#689d6a"
color7 = "#a89984"
color8 = "#928374"
color9 = "#fb4934"
color10 = "#b8bb26"
color11 = "#fabd2f"
color12 = "#83a598"
color13 = "#d3869b"
color14 = "#8ec07c"
color15 = "#ebdbb2"

# Style layer: the second var layer, alongside [theme.colors]. These values are
# exactly what the stylesheet hardcodes, so an untouched [style] renders
# pixel-identical — tuning happens here, in your dotfile. Lengths carry a unit
# (px/rem/em/%/vh/vw), opacity is an integer percent (no floats — the parser
# has no float branch), and a value that fails its validator falls back to the
# default for that one key while the rest still apply.
[style]
radius = "2px"
gap = "1em"
pad_y = "0"
pad_x = "8px"
row_pad_y = "2px"
row_pad_x = "8px"
border = "1px"
panel_width = "38rem"
panel_height = "60vh"
opacity = 100
blur = "0"
font = "monospace"
font_size = "12px"
motion_ms = 120
motion_ease = "cubic-bezier(0.22, 1, 0.36, 1)"
motion = true # master switch; false = 0ms everywhere

# Panels (tabs, settings, and every later source): the default scope of the tab
# panel. "workspace" lists this workspace's tabs, "all" lists every workspace's
# and names the workspace on each row. Panel width comes from [style]
# panel_width and nowhere else.
[panels]
scope = "workspace"

# Privacy: the handful of Firefox prefs Aether owns. This file is the
# authority — the value is pushed into network.trr.* on every load and reload,
# so the settings panel can honestly report where a value came from.
[privacy]
doh = "fallback" # off | fallback | strict → network.trr.mode 0/2/3
doh_url = "https://dns.quad9.net/dns-query"

# Commands: scroll_down scroll_up half_down half_up top bottom back forward
# open open_tab tab tab_new tab_close tab_next tab_prev tabs_toggle reload
# hints insert esc palette theme_reload graveyard ws ws_next ws_rename
# focus done ai ai_on ai_off zap boost boost_on boost_off boost_edit
[keymap.normal]
"a" = "ai"
"j" = "scroll_down"
"k" = "scroll_up"
"d" = "half_down"
"u" = "half_up"
"gg" = "top"
"gw" = "ws_next"
"G" = "bottom"
"H" = "back"
"L" = "forward"
"o" = "open"
"O" = "open_tab"
"t" = "tab_new"
"x" = "tab_close"
"J" = "tab_next"
"K" = "tab_prev"
"T" = "tabs_toggle"
"r" = "reload"
"f" = "hints"
"i" = "insert"
":" = "palette"
"?" = "which_key"

# Reserved browser shortcuts Aether takes over — the spike's core proof.
[keymap.reserved]
"C-w" = "tab_close"
"C-t" = "tab_new"
"C-n" = "tab_new"      # new window later; prove the override now
"C-Tab" = "tab_next"
